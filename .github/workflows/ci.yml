name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Pinned: older npm releases resolve some transitive wasm bindings differently
      # and reject this lockfile as out of sync.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Bundle iOS (Metro export)
        run: npm run build:ios
